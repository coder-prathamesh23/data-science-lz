trigger: none
pr: none

parameters:
  - name: action
    displayName: Terraform action
    type: string
    default: plan
    values:
      - plan
      - apply

  - name: environment
    displayName: Target environment
    type: string
    default: dev
    values:
      - dev
      - qa
      - prod

  - name: stackPath
    displayName: Stack path
    type: string
    default: stacks/data-science-lz-core

  - name: terraformVersion
    displayName: Terraform version
    type: string
    default: 1.7.5

variables:
  - ${{ if eq(parameters.environment, 'dev') }}:
      - group: DATA_SCIENCE_LZ_DEV

  - ${{ if eq(parameters.environment, 'qa') }}:
      - group: DATA_SCIENCE_LZ_QA

  - ${{ if eq(parameters.environment, 'prod') }}:
      - group: DATA_SCIENCE_LZ_PROD

  - name: TF_IN_AUTOMATION
    value: "true"

pool:
  name: azumanage-flz

stages:
  - stage: Validate
    displayName: Validate
    jobs:
      - job: Validate
        displayName: Terraform Validate
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - bash: |
              set -euo pipefail

              STACK_PATH="${{ parameters.stackPath }}"
              TFVARS_FILE="${STACK_PATH}/tfvars/${{ parameters.environment }}.tfvars"

              if [ ! -d "${STACK_PATH}" ]; then
                echo "ERROR: Stack path does not exist: ${STACK_PATH}"
                exit 1
              fi

              if [ ! -f "${TFVARS_FILE}" ]; then
                echo "ERROR: Environment tfvars file does not exist: ${TFVARS_FILE}"
                exit 1
              fi

              terraform fmt -check -diff -recursive "${STACK_PATH}"

              cd "${STACK_PATH}"

              terraform init \
                -backend=false \
                -input=false \
                -no-color

              terraform validate -no-color
            displayName: Format and validate

  - stage: Plan
    displayName: Terraform Plan
    dependsOn: Validate
    condition: succeeded()
    jobs:
      - job: Plan
        displayName: Terraform Plan
        steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: ${{ parameters.terraformVersion }}

          - task: AzureCLI@2
            displayName: Terraform Init and Plan
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -euo pipefail

                : "${TF_BACKEND_SUBSCRIPTION_ID:?TF_BACKEND_SUBSCRIPTION_ID is required}"
                : "${TF_BACKEND_RG:?TF_BACKEND_RG is required}"
                : "${TF_BACKEND_STORAGE:?TF_BACKEND_STORAGE is required}"
                : "${TF_BACKEND_CONTAINER:?TF_BACKEND_CONTAINER is required}"
                : "${servicePrincipalId:?Service principal ID was not provided by the Azure service connection}"
                : "${tenantId:?Tenant ID was not provided by the Azure service connection}"

                STACK_PATH="${{ parameters.stackPath }}"
                ENVIRONMENT="${{ parameters.environment }}"
                TFVARS_FILE="tfvars/${ENVIRONMENT}.tfvars"
                STATE_KEY="${ENVIRONMENT}/${STACK_PATH}/terraform.tfstate"

                cd "${STACK_PATH}"

                if [ ! -f "${TFVARS_FILE}" ]; then
                  echo "ERROR: tfvars file not found: ${STACK_PATH}/${TFVARS_FILE}"
                  exit 1
                fi

                export ARM_CLIENT_ID="${servicePrincipalId}"
                export ARM_TENANT_ID="${tenantId}"
                export ARM_SUBSCRIPTION_ID="${TF_BACKEND_SUBSCRIPTION_ID}"
                export ARM_USE_CLI=false

                if [ -n "${servicePrincipalKey:-}" ]; then
                  export ARM_CLIENT_SECRET="${servicePrincipalKey}"
                elif [ -n "${idToken:-}" ]; then
                  export ARM_USE_OIDC=true
                  export ARM_OIDC_TOKEN="${idToken}"
                else
                  echo "ERROR: Service connection did not provide a client secret or workload identity token."
                  exit 1
                fi

                echo "Environment : ${ENVIRONMENT}"
                echo "Stack       : ${STACK_PATH}"
                echo "tfvars      : ${TFVARS_FILE}"
                echo "State key   : ${STATE_KEY}"

                terraform init \
                  -reconfigure \
                  -input=false \
                  -no-color \
                  -backend-config="subscription_id=${TF_BACKEND_SUBSCRIPTION_ID}" \
                  -backend-config="resource_group_name=${TF_BACKEND_RG}" \
                  -backend-config="storage_account_name=${TF_BACKEND_STORAGE}" \
                  -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
                  -backend-config="key=${STATE_KEY}" \
                  -backend-config="use_azuread_auth=true"

                terraform plan \
                  -input=false \
                  -no-color \
                  -var-file="${TFVARS_FILE}" \
                  -out="$(Build.ArtifactStagingDirectory)/tfplan"

                terraform show \
                  -no-color \
                  "$(Build.ArtifactStagingDirectory)/tfplan" \
                  > "$(Build.ArtifactStagingDirectory)/tfplan.txt"

                if [ -f ".terraform.lock.hcl" ]; then
                  cp ".terraform.lock.hcl" "$(Build.ArtifactStagingDirectory)/"
                fi

          - publish: "$(Build.ArtifactStagingDirectory)"
            artifact: tfplan
            displayName: Publish Terraform Plan

  - stage: Apply
    displayName: Terraform Apply
    dependsOn: Plan
    condition: >
      and(
        succeeded(),
        eq('${{ parameters.action }}', 'apply')
      )
    jobs:
      - deployment: Apply
        displayName: Apply Terraform Plan
        environment: data-science-lz-${{ parameters.environment }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform
                  inputs:
                    terraformVersion: ${{ parameters.terraformVersion }}

                - download: current
                  artifact: tfplan
                  displayName: Download Terraform Plan

                - task: AzureCLI@2
                  displayName: Terraform Init and Apply
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -euo pipefail

                      : "${TF_BACKEND_SUBSCRIPTION_ID:?TF_BACKEND_SUBSCRIPTION_ID is required}"
                      : "${TF_BACKEND_RG:?TF_BACKEND_RG is required}"
                      : "${TF_BACKEND_STORAGE:?TF_BACKEND_STORAGE is required}"
                      : "${TF_BACKEND_CONTAINER:?TF_BACKEND_CONTAINER is required}"
                      : "${servicePrincipalId:?Service principal ID was not provided by the Azure service connection}"
                      : "${tenantId:?Tenant ID was not provided by the Azure service connection}"

                      STACK_PATH="${{ parameters.stackPath }}"
                      ENVIRONMENT="${{ parameters.environment }}"
                      STATE_KEY="${ENVIRONMENT}/${STACK_PATH}/terraform.tfstate"

                      cd "${STACK_PATH}"

                      export ARM_CLIENT_ID="${servicePrincipalId}"
                      export ARM_TENANT_ID="${tenantId}"
                      export ARM_SUBSCRIPTION_ID="${TF_BACKEND_SUBSCRIPTION_ID}"
                      export ARM_USE_CLI=false

                      if [ -n "${servicePrincipalKey:-}" ]; then
                        export ARM_CLIENT_SECRET="${servicePrincipalKey}"
                      elif [ -n "${idToken:-}" ]; then
                        export ARM_USE_OIDC=true
                        export ARM_OIDC_TOKEN="${idToken}"
                      else
                        echo "ERROR: Service connection did not provide a client secret or workload identity token."
                        exit 1
                      fi

                      if [ -f "$(Pipeline.Workspace)/tfplan/.terraform.lock.hcl" ]; then
                        cp \
                          "$(Pipeline.Workspace)/tfplan/.terraform.lock.hcl" \
                          ".terraform.lock.hcl"
                      fi

                      echo "Environment : ${ENVIRONMENT}"
                      echo "Stack       : ${STACK_PATH}"
                      echo "State key   : ${STATE_KEY}"

                      terraform init \
                        -reconfigure \
                        -input=false \
                        -no-color \
                        -backend-config="subscription_id=${TF_BACKEND_SUBSCRIPTION_ID}" \
                        -backend-config="resource_group_name=${TF_BACKEND_RG}" \
                        -backend-config="storage_account_name=${TF_BACKEND_STORAGE}" \
                        -backend-config="container_name=${TF_BACKEND_CONTAINER}" \
                        -backend-config="key=${STATE_KEY}" \
                        -backend-config="use_azuread_auth=true"

                      terraform apply \
                        -input=false \
                        -no-color \
                        "$(Pipeline.Workspace)/tfplan/tfplan"
